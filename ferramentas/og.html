<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Imagem de compartilhamento</title>
<!-- Fonte da imagem assets/img/og.png (1200x630). Regenerar: python3 ferramentas/gerar-og.py -->
<style>
  @font-face { font-family: "Archivo"; src: url("../assets/fonts/archivo-var-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "IBM Plex Mono"; src: url("../assets/fonts/plexmono-600-latin.woff2") format("woff2"); font-weight: 600; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(55% 60% at 85% 100%, rgba(255, 178, 26, 0.16), transparent 70%),
      linear-gradient(transparent 0 97%, rgba(255, 255, 255, 0.03) 97% 100%) 0 0 / 100% 42px,
      #07090d;
    color: #eef2f6; font-family: "Archivo", sans-serif;
    padding: 60px 72px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .quem { display: flex; align-items: center; gap: 14px; font-size: 26px; color: #a9b3bf; }
  .sigla { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 12px; background: #ffb21a; color: #0b0b0b; font: 600 24px/1 "IBM Plex Mono", monospace; }
  h1 { font-size: 72px; font-weight: 820; font-stretch: 112%; letter-spacing: -0.03em; line-height: 0.98; max-width: 16ch; }
  .numeros { display: flex; gap: 22px; }
  .numero { flex: 1; padding: 20px 22px; border-radius: 16px; background: linear-gradient(180deg, #0d1117, #090c11); border: 1px solid #1f2733; }
  .valor { display: flex; gap: 4px; margin-bottom: 12px; }
  .p { display: grid; place-items: center; width: 40px; height: 56px; border-radius: 5px; background: linear-gradient(180deg, #1a2029 0 50%, #141920 50% 100%); font: 600 32px/1 "IBM Plex Mono", monospace; color: #ffb21a; position: relative; }
  .p::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.7); }
  .rotulo { font-size: 22px; color: #a9b3bf; line-height: 1.3; }
</style>
</head>
<body>
  <p class="quem"><span class="sigla">GT</span>Gabriel Tavares · Tech Lead Fullstack</p>
  <h1>Sistemas B2B multi&#8209;tenant que aguentam escala.</h1>
  <div class="numeros" id="numeros"></div>
  <script>
    const itens = [['+50K', 'compradores na plataforma'], ['+10', 'distribuidoras'], ['+10', 'pessoas no time que lidero']];
    const caixa = document.getElementById('numeros');
    for (const [valor, rotulo] of itens) {
      const n = document.createElement('div');
      n.className = 'numero';
      const v = document.createElement('div');
      v.className = 'valor';
      for (const ch of valor) {
        const p = document.createElement('span');
        p.className = 'p';
        p.textContent = ch;
        v.appendChild(p);
      }
      const r = document.createElement('p');
      r.className = 'rotulo';
      r.textContent = rotulo;
      n.append(v, r);
      caixa.appendChild(n);
    }
  </script>
</body>
</html>
